[project]
name = "pedestriancrowd"
version = "0.1.0"
description = "Script samples for automatic processing of scanned surveys"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "opencv-contrib-python>=4.13.0.92",
    "opencv-python>=4.13.0.92",
    "pdf2image>=1.17.0",
    "pillow>=12.1.1",
    "pytesseract>=0.3.13",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "transformers>=5.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.4",
]
